name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm run test:ci

      - name: Construire l'application
        run: npm run build:github-pages

      # GitHub Pages ne connaît pas les routes Angular : sans ce fichier, /vote renverrait une 404.
      - name: Copier index.html en 404.html
        run: cp dist/cimetiere-du-sprint/browser/index.html dist/cimetiere-du-sprint/browser/404.html

      # Le teaser est partagé sur Messenger : son robot doit recevoir un code 200, pas la page 404.
      - name: Créer la vraie page /teaser/
        run: |
          mkdir -p dist/cimetiere-du-sprint/browser/teaser
          cp dist/cimetiere-du-sprint/browser/index.html dist/cimetiere-du-sprint/browser/teaser/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/cimetiere-du-sprint/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
