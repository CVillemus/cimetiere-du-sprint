<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Le Cimetière du Sprint</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14121f" />
    <meta
      name="description"
      content="Soirée horreur samedi 10 octobre à 18h : 10 films, 10 âmes, 1 seul survivra. Viens avec ton téléphone, c'est toi qui votes."
    />

    <!--
      Aperçu des liens (Messenger, Facebook, WhatsApp…). Ces robots n'exécutent pas le JavaScript :
      tout doit être écrit ici, avec des URL absolues. L'image est générée par
      `npm run generer:image-partage`.
      Pas de og:url exprès : chaque adresse partagée est lue séparément par Facebook,
      ce qui permet de contourner son cache avec un paramètre (ex. /teaser/?v=2).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Le Cimetière du Sprint" />
    <meta property="og:title" content="Le Cimetière du Sprint · Samedi 18h" />
    <meta
      property="og:description"
      content="Soirée horreur : 10 films, 10 âmes, 1 seul survivra. Viens avec ton téléphone, c'est toi qui votes."
    />
    <meta
      property="og:image"
      content="https://cvillemus.github.io/cimetiere-du-sprint/og-teaser.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cimetière pixel art au clair de lune : Le Cimetière du Sprint, samedi 10 octobre à 18h."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Le Cimetière du Sprint · Samedi 18h" />
    <meta
      name="twitter:description"
      content="Soirée horreur : 10 films, 10 âmes, 1 seul survivra."
    />
    <meta
      name="twitter:image"
      content="https://cvillemus.github.io/cimetiere-du-sprint/og-teaser.png"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=Silkscreen&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
