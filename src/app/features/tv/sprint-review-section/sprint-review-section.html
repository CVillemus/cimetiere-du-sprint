<div class="sprint-review">

  <h2 class="sprint-review__title">Sprint Review</h2>

  <ol class="sprint-review__podium" aria-label="Podium">
    <li class="sprint-review__step sprint-review__step--second">
      <span class="sprint-review__rank">2</span>

    <li class="sprint-review__step sprint-review__step--first">
