<main class="tv-page" #sectionScroller (scrollend)="handleSectionScrollEnd()">
  @for (section of sections; track $index; let sectionIndex = $index) {
    <section class="tv-page__section">
      @switch (section.kind) {
        @case ('intro') {
          <app-intro-section />
        }
        @case ('film') {
          <app-film-section
            [film]="section.film"
            [tombNumber]="section.tombNumber"
            [isCurrentSection]="sectionIndex === currentSectionIndex()"
          />
        }
        @case ('sprint-review') {
          <app-sprint-review-section />
        }
      }
    </section>
  }
</main>

<app-section-progress />
