<svg
  class="film-scene"
  viewBox="0 0 64 48"
  preserveAspectRatio="xMidYMid slice"
  shape-rendering="crispEdges"
  role="img"
  aria-label="Cimetière de nuit"
>
  <rect class="film-scene__sky" width="64" height="48" />
  <g class="film-scene__stars">
    <rect x="8" y="5" width="1" height="1" />
    <rect x="20" y="9" width="1" height="1" />
    <rect x="33" y="4" width="1" height="1" />
    <rect x="58" y="15" width="1" height="1" />
  </g>
  <g class="film-scene__moon">
    <rect x="46" y="4" width="6" height="8" />
    <rect x="45" y="5" width="8" height="6" />
  </g>
  <rect class="film-scene__hills" x="0" y="30" width="64" height="10" />
  <g class="film-scene__trees">
    <rect x="3" y="14" width="2" height="2" />
    <rect x="2" y="16" width="4" height="4" />
    <rect x="1" y="20" width="6" height="5" />
    <rect x="0" y="25" width="8" height="6" />
    <rect x="3" y="31" width="2" height="6" />
    <rect x="56" y="16" width="2" height="2" />
    <rect x="55" y="18" width="4" height="5" />
    <rect x="54" y="23" width="6" height="5" />
    <rect x="53" y="28" width="8" height="5" />
    <rect x="56" y="33" width="2" height="5" />
  </g>
  <rect class="film-scene__ground" x="0" y="38" width="64" height="10" />
  <g class="film-scene__tomb">
    <rect x="26" y="26" width="12" height="16" />
    <rect x="27" y="25" width="10" height="1" />
    <rect x="28" y="24" width="8" height="1" />
  </g>
  <text class="film-scene__tomb-number" x="32" y="36" text-anchor="middle">
    {{ tombNumber() }}
  </text>
  <g class="film-scene__candle">
    <rect x="42" y="39" width="1" height="3" />
    <rect class="film-scene__flame" x="42" y="38" width="1" height="1" />
  </g>
  <g class="film-scene__fog">
    <rect x="-10" y="38" width="40" height="2" />
    <rect x="30" y="40" width="44" height="2" />
  </g>
</svg>
