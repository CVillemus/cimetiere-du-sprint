<canvas
  #sceneCanvas
  class="film-scene__canvas"
  [width]="sceneWidth"
  [height]="sceneHeight"
  role="img"
  aria-label="Décor du film en pixel art"
></canvas>
<canvas
  #lightCanvas
  class="film-scene__canvas film-scene__canvas--lights"
  [width]="sceneWidth"
  [height]="sceneHeight"
  aria-hidden="true"
></canvas>
