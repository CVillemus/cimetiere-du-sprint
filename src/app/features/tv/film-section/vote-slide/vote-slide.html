<header class="vote-slide__header">
  <p class="vote-slide__eyebrow">Les votes</p>
  <h2 class="vote-slide__title">{{ film().frenchTitle }}</h2>
</header>

<p class="vote-slide__average">
  Moyenne <strong>{{ formattedAverageScore() }}</strong> / 5
</p>
<ul class="vote-slide__cards">
  @for (revealedVoteCard of filmVoteSummary().revealedVoteCards; track revealedVoteCard.pseudo) {
    <li class="vote-slide__card" [style.animation-delay.ms]="$index * 120">
      <app-pixel-icon
        class="vote-slide__card-icon"
        [iconGrid]="revealedVoteCard.voteCard.iconGrid"
      />
      <span class="vote-slide__card-pseudo">{{ revealedVoteCard.pseudo }}</span>
      <span class="vote-slide__card-label">{{ revealedVoteCard.voteCard.label }}</span>
    </li>
  }
</ul>
