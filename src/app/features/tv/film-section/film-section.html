<div class="film-section__track" [style.transform]="slideTrackTransform()">
  <div class="film-section__slide" [inert]="activeSlideIndex() !== 0">
    <app-summary-slide [film]="film()" [tombNumber]="tombNumber()" [filmCount]="filmCount" />
  </div>
  <div class="film-section__slide" [inert]="activeSlideIndex() !== 1">
    <app-press-slide
      [film]="film()"
      [tombNumber]="tombNumber()"
      [filmCount]="filmCount"
      [isActive]="activeSlideKind() === 'press'"
    />
  </div>
  <div class="film-section__slide" [inert]="activeSlideIndex() !== 2">
    <app-trailer-slide [film]="film()" [isActive]="activeSlideKind() === 'trailer'" />
  </div>
  <div class="film-section__slide" [inert]="activeSlideIndex() !== 3">
    <app-vote-slide [film]="film()" [isActive]="activeSlideKind() === 'vote'" />
  </div>
</div>

@if (isVoteStatusVisible()) {
  <app-vote-status class="film-section__vote-status" [filmId]="film().id" />
}

<nav class="film-section__tabs" aria-label="Slides du film">
  @for (slideTab of slideTabs; track slideTab.slideKind; let slideIndex = $index) {
    <button
      type="button"
      class="film-section__tab"
      [class.film-section__tab--active]="slideIndex === activeSlideIndex()"
      [class.film-section__tab--locked]="slideTab.slideKind === 'vote' && !isVoteSlideUnlocked()"
      [attr.aria-current]="slideIndex === activeSlideIndex() ? 'step' : null"
      [attr.aria-disabled]="slideTab.slideKind === 'vote' && !isVoteSlideUnlocked()"
      (click)="selectSlide(slideIndex)"
    >
      {{ slideTab.label }}
    </button>
  }
</nav>
