@if (triggerWarnings().length > 0) {
  <p class="trigger-warning-list">
    <span class="trigger-warning-list__label"
      ><span class="trigger-warning-list__icon" aria-hidden="true">⚠</span> Warning :</span
    >
    @for (triggerWarning of triggerWarnings(); track triggerWarning; let isLast = $last) {
      <span class="trigger-warning-list__item">{{ triggerWarning }}</span>
      @if (!isLast) {
        <span class="trigger-warning-list__separator" aria-hidden="true">◆</span>
      }
    }
  </p>
}
